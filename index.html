<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: #fff;
        }

        /* ── Stars Background ── */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            0%   { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* ── Main Content ── */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            margin-bottom: 120px;
        }

        .coming-soon {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #f9d423, #ff4e50, #f9d423);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .subtitle {
            font-size: 1.2rem;
            font-weight: 300;
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
        }

        /* ── Countdown Timer ── */
        .countdown {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 20px 28px;
            min-width: 100px;
            transition: transform 0.3s;
        }

        .countdown-item:hover {
            transform: translateY(-5px);
        }

        .countdown-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: #f9d423;
        }

        .countdown-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 5px;
        }

        /* ── Email Signup ── */
        .signup {
            margin-top: 40px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .signup input {
            padding: 14px 24px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            width: 280px;
            transition: border 0.3s;
        }

        .signup input:focus {
            border-color: #f9d423;
        }

        .signup input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .signup button {
            padding: 14px 30px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #f9d423, #f83600);
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .signup button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(249, 212, 35, 0.4);
        }

        /* ── Ground Line ── */
        .ground {
            position: fixed;
            bottom: 60px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            z-index: 1;
        }

        /* ── Ball Rolling Animation ── */
        .ball-container {
            position: fixed;
            bottom: 40px;
            left: -60px;
            z-index: 3;
            animation: rollAcross 6s linear infinite;
        }

        @keyframes rollAcross {
            0%   { left: -60px; }
            100% { left: calc(100% + 60px); }
        }

        .ball {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fff, #f9d423 40%, #f83600);
            box-shadow:
                0 0 20px rgba(249, 212, 35, 0.5),
                0 0 60px rgba(249, 212, 35, 0.2),
                inset -4px -4px 8px rgba(0,0,0,0.2);
            animation: spin 1s linear infinite;
            position: relative;
        }

        /* Stripe on ball to make spin visible */
        .ball::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.25);
            transform: translateY(-50%);
            border-radius: 50%;
        }

        .ball::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 3px;
            height: 100%;
            background: rgba(0, 0, 0, 0.25);
            transform: translateX(-50%);
            border-radius: 50%;
        }

        @keyframes spin {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Ball shadow on ground */
        .ball-shadow {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            filter: blur(4px);
            animation: shadowPulse 0.3s ease infinite alternate;
        }

        @keyframes shadowPulse {
            0%   { opacity: 0.3; transform: translateX(-50%) scaleX(1); }
            100% { opacity: 0.5; transform: translateX(-50%) scaleX(1.1); }
        }

        /* ── Particles Trail ── */
        .trail {
            position: fixed;
            bottom: 50px;
            left: 0;
            width: 100%;
            height: 20px;
            z-index: 2;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #f9d423;
            opacity: 0;
            animation: particleFade 6s linear infinite;
        }

        @keyframes particleFade {
            0%   { opacity: 0; transform: translateY(0) scale(1); }
            50%  { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-20px) scale(0); }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .coming-soon {
                font-size: 2.2rem;
            }
            .countdown {
                gap: 12px;
            }
            .countdown-item {
                padding: 14px 16px;
                min-width: 70px;
            }
            .countdown-number {
                font-size: 1.6rem;
            }
            .signup {
                flex-direction: column;
                align-items: center;
            }
            .signup input {
                width: 260px;
            }
        }
    </style>
</head>
<body>

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Main Content -->
    <div class="content">
        <h1 class="coming-soon">Coming Soon</h1>
        <p class="subtitle">Something amazing is on the way</p>

        <div class="countdown" id="countdown">
            <div class="countdown-item">
                <div class="countdown-number" id="days">00</div>
                <div class="countdown-label">Days</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="hours">00</div>
                <div class="countdown-label">Hours</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="minutes">00</div>
                <div class="countdown-label">Minutes</div>
            </div>
            <div class="countdown-item">
                <div class="countdiv-label" id="seconds">00</div>
                <div class="countdown-label">Seconds</div>
            </div>
        </div>

        <form class="signup" onsubmit="handleSignup(event)">
            <input type="email" placeholder="Enter your email" required>
            <button type="submit">Notify Me</button>
        </form>
    </div>

    <!-- Ground Line -->
    <div class="ground"></div>

    <!-- Rolling Ball -->
    <div class="ball-container" id="ballContainer">
        <div class="ball"></div>
        <div class="ball-shadow"></div>
    </div>

    <!-- Particles Trail -->
    <div class="trail" id="trail"></div>

    <script>
        // ── Generate Stars ──
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.animationDuration = (1 + Math.random() * 3) + 's';
            star.style.width = star.style.height = (1 + Math.random() * 2) + 'px';
            starsContainer.appendChild(star);
        }

        // ── Generate Trail Particles ──
        const trailContainer = document.getElementById('trail');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = (i * 3.5) + '%';
            particle.style.animationDelay = (i * 0.2) + 's';
            particle.style.width = particle.style.height = (2 + Math.random() * 4) + 'px';
            trailContainer.appendChild(particle);
        }

        // ── Countdown Timer (30 days from now) ──
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 30);

        function updateCountdown() {
            const now = new Date();
            const diff = launchDate - now;

            if (diff <= 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // ── Notify Button ──
        function handleSignup(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.textContent = '✓ Subscribed!';
            btn.style.background = 'linear-gradient(135deg, #11998e, #38ef7d)';
            setTimeout(() => {
                btn.textContent = 'Notify Me';
                btn.style.background = '';
                e.target.reset();
            }, 3000);
        }
    </script>
</body>
</html>
